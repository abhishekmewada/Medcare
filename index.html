<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/png" href="/images/Gemini_Generated_Image_6pkwcd6pkwcd6pkw-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCare</title>

    <!-- Favicon ko zoom/bada karne ki script -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const link = document.getElementById('favicon');
        const img = new Image();
        img.src = link.href;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          
          // Zoom factor (1.6x bada). Agar aur bada karna ho toh 1.8 ya 2.0 kar dena
          const scale = 1.6; 
          const w = canvas.width * scale;
          const h = canvas.height * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;

          ctx.drawImage(img, x, y, w, h);
          link.href = canvas.toDataURL('image/png');
        };
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
